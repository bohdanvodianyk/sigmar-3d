<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1680" height="470" fill="#ffffff"/>

  <!-- defs -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- title -->
  <text x="840" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">SIGMAR-3D pipeline</text>
  <text x="840" y="72" text-anchor="middle" font-size="17" fill="#64748b">Training-free pairwise registration &#183; identity initialisation &#183; one fixed configuration</text>

  <!-- component brackets -->
  <g stroke-width="2.5" fill="none">
    <path d="M300,110 h330" stroke="#2563eb"/>
    <path d="M300,110 v10 M630,110 v10" stroke="#2563eb"/>
    <path d="M660,110 h690" stroke="#0d9488"/>
    <path d="M660,110 v10 M1350,110 v10" stroke="#0d9488"/>
  </g>
  <text x="465" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">SIGMA &#8212; local descriptor</text>
  <text x="1005" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#0d9488">R-3D &#8212; scene-adaptive registration</text>

  <!-- stage boxes: x positions -->
  <!-- 1 Input -->
  <g>
    <rect x="30" y="150" width="210" height="150" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <text x="135" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Input pair</text>
    <circle cx="95" cy="235" r="26" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-dasharray="3 4"/>
    <circle cx="170" cy="248" r="26" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-dasharray="3 4"/>
    <g fill="#64748b"><circle cx="88" cy="228" r="2"/><circle cx="102" cy="240" r="2"/><circle cx="96" cy="248" r="2"/><circle cx="84" cy="242" r="2"/><circle cx="108" cy="230" r="2"/>
      <circle cx="163" cy="241" r="2"/><circle cx="177" cy="255" r="2"/><circle cx="171" cy="262" r="2"/><circle cx="159" cy="256" r="2"/><circle cx="183" cy="244" r="2"/></g>
    <text x="135" y="292" text-anchor="middle" font-size="13" fill="#64748b">source A, target B</text>
  </g>

  <!-- 2 Keypoints + LRF -->
  <g>
    <rect x="300" y="150" width="210" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="405" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Keypoints + LRF</text>
    <line x1="405" y1="250" x2="405" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="405" y1="250" x2="445" y2="258" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="405" y1="250" x2="378" y2="285" stroke="#1e293b" stroke-width="1.6"/>
    <circle cx="405" cy="250" r="4" fill="#2563eb"/>
    <text x="405" y="292" text-anchor="middle" font-size="13" fill="#64748b">voxel subsample, normals</text>
  </g>

  <!-- 3 SIGMA descriptor -->
  <g>
    <rect x="570" y="150" width="210" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="675" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">SIGMA descriptor</text>
    <circle cx="675" cy="242" r="34" fill="url(#sphere)" stroke="#2563eb" stroke-width="1.4" opacity="0.92"/>
    <ellipse cx="675" cy="242" rx="34" ry="12" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <ellipse cx="675" cy="242" rx="12" ry="34" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <line x1="641" y1="242" x2="709" y2="242" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>
    <text x="675" y="294" text-anchor="middle" font-size="13" fill="#64748b">(3,8,4) bins &#8594; 96-d, &#8467;2-norm</text>
  </g>

  <!-- 4 Matching -->
  <g>
    <rect x="840" y="150" width="210" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
    <text x="945" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Matching</text>
    <circle cx="905" cy="235" r="3.5" fill="#0d9488"/><circle cx="985" cy="225" r="3.5" fill="#0d9488"/>
    <circle cx="905" cy="258" r="3.5" fill="#0d9488"/><circle cx="985" cy="262" r="3.5" fill="#0d9488"/>
    <line x1="905" y1="235" x2="985" y2="225" stroke="#0d9488" stroke-width="1.6"/>
    <line x1="905" y1="258" x2="985" y2="262" stroke="#0d9488" stroke-width="1.6"/>
    <text x="945" y="292" text-anchor="middle" font-size="13" fill="#64748b">ratio 0.85 + mutual-NN</text>
  </g>

  <!-- 5 RANSAC -->
  <g>
    <rect x="1110" y="150" width="210" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
    <text x="1215" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">RANSAC coarse</text>
    <polygon points="1215,212 1245,268 1185,268" fill="none" stroke="#0d9488" stroke-width="1.6"/>
    <circle cx="1215" cy="212" r="3" fill="#0d9488"/><circle cx="1245" cy="268" r="3" fill="#0d9488"/><circle cx="1185" cy="268" r="3" fill="#0d9488"/>
    <text x="1215" y="292" text-anchor="middle" font-size="13" fill="#64748b">m=4, &#949;=3&#948;&#771;, SVD fit</text>
  </g>

  <!-- 6 Refinement -->
  <g>
    <rect x="1380" y="150" width="210" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
    <text x="1485" y="178" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0f172a">Multi-scale GICP</text>
    <rect x="1452" y="210" width="66" height="14" fill="#99f6e4" stroke="#0d9488" stroke-width="1"/>
    <rect x="1460" y="228" width="50" height="12" fill="#5eead4" stroke="#0d9488" stroke-width="1"/>
    <rect x="1467" y="244" width="36" height="10" fill="#2dd4bf" stroke="#0d9488" stroke-width="1"/>
    <text x="1485" y="292" text-anchor="middle" font-size="13" fill="#0d9488" font-weight="600">accept iff tRMSE &#8595;</text>
  </g>

  <!-- flow arrows between boxes -->
  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="240" y1="225" x2="298" y2="225"/>
    <line x1="510" y1="225" x2="568" y2="225"/>
    <line x1="780" y1="225" x2="838" y2="225"/>
    <line x1="1050" y1="225" x2="1108" y2="225"/>
    <line x1="1320" y1="225" x2="1378" y2="225"/>
  </g>

  <!-- output -->
  <line x1="1485" y1="300" x2="1485" y2="350" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="1360" y="360" width="250" height="86" rx="12" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.6"/>
  <text x="1485" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Aligned pair</text>
  <text x="1485" y="418" text-anchor="middle" font-size="14" fill="#4d7c0f">rigid transform T (R, t)</text>
  <text x="1485" y="437" text-anchor="middle" font-size="12.5" fill="#64748b">reported as RRE / RTE / FMR</text>
</svg>
